[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_BACKEND_URL = "https://invetedyoubackend.onrender.com"
  NEXT_PUBLIC_API_URL = "https://invetedyoubackend.onrender.com/api/v1"
  NEXT_PUBLIC_MEDIA_URL = "https://invetedyoubackend.onrender.com/uploads"
  BACKEND_URL = "https://invetedyoubackend.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://invetedyoubackend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "https://invetedyoubackend.onrender.com/uploads/:splat"
  status = 200
  force = true
